<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e">
<title>Asset Detail</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--brand:#0f766e;--brand2:#14b8a6;--bg:#f4f7f8;--card:#fff;--text:#172126;--muted:#66757d;--line:#e5eaed;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;color:var(--text)}.app{max-width:640px;margin:auto;padding-bottom:32px}.head{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 24px;border-radius:0 0 24px 24px}.top{display:flex;align-items:center;gap:12px}.back{border:0;background:#ffffff20;color:#fff;width:40px;height:40px;border-radius:12px;font-size:23px}.title{font-size:22px;font-weight:800}.sub{font-size:12px;opacity:.85}.content{padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.heroRow{display:flex;justify-content:space-between;gap:12px}.type{font-size:12px;font-weight:800;color:var(--brand);text-transform:uppercase}.name{font-size:21px;font-weight:850;margin-top:3px}.assetNo{color:var(--muted);font-size:13px;margin-top:5px}.pill{height:max-content;background:#dcfce7;color:#166534;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800}.sectionTitle{font-size:13px;font-weight:850;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#f8fafb;border-radius:12px;padding:11px}.label{font-size:11px;color:var(--muted)}.value{font-size:14px;font-weight:700;margin-top:3px;word-break:break-word}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{background:#f3f6f7;border:1px solid var(--line);border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}.photo img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}.photo{cursor:pointer}.photoLabel{font-size:11px;color:var(--muted);margin-top:5px}.actions{display:grid;gap:9px}.btn{border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800}.edit{background:var(--brand);color:#fff}.remove{background:#fff1f2;color:var(--danger);border:1px solid #fecdd3}.history{background:#e6fffb;color:var(--brand)}.state{text-align:center;padding:50px 15px;color:var(--muted)}.spin{width:32px;height:32px;margin:0 auto 12px;border:3px solid #d9e3e7;border-top-color:var(--brand);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;border-radius:14px;padding:13px;display:none;margin-bottom:12px}
.lightbox{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:18px}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:88vh;object-fit:contain;transform-origin:center;transition:transform .18s ease}.lightboxClose{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:28px}.lightboxLabel{position:absolute;left:16px;right:70px;bottom:calc(15px + env(safe-area-inset-bottom));color:#fff;font-size:13px}.lightboxHint{position:absolute;top:calc(22px + env(safe-area-inset-top));left:18px;color:#ffffffb8;font-size:11px}
.removeModal{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}.removeModal.open{display:flex}.removeSheet{width:min(100%,640px);background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.removeTitle{font-size:19px;font-weight:850}.removeSub{font-size:12px;color:var(--muted);margin:4px 0 14px}.reasonOption{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0}.reasonOption input{width:18px;height:18px}.reasonOther{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;display:none;margin-top:8px}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.cancelBtn{background:#f1f5f9;color:#475569}.confirmRemove{background:#b91c1c;color:#fff}.confirmRemove:disabled{opacity:.55}</style></head><body>
<div id="lightbox" class="lightbox" onclick="closePhoto(event)"><button class="lightboxClose" onclick="closePhoto(event,true)">×</button><div class="lightboxHint">แตะพื้นที่ดำเพื่อปิด</div><img id="lightboxImg" alt=""><div id="lightboxLabel" class="lightboxLabel"></div></div><div id="removeModal" class="removeModal" onclick="modalBackdrop(event)"><div class="removeSheet"><div class="removeTitle">นำ Asset ออกจากความรับผิดชอบ</div><div class="removeSub">Asset No. <b id="removeAssetNo"></b><br>Asset จะยังอยู่ในระบบและเก็บประวัติการเปลี่ยนแปลงไว้</div><label class="reasonOption"><input type="radio" name="removeReason" value="ไม่ได้ใช้งานแล้ว">ไม่ได้ใช้งานแล้ว</label><label class="reasonOption"><input type="radio" name="removeReason" value="ส่งต่อให้ผู้อื่น">ส่งต่อให้ผู้อื่น</label><label class="reasonOption"><input type="radio" name="removeReason" value="ไม่พบ Asset ที่หน้างาน">ไม่พบ Asset ที่หน้างาน</label><label class="reasonOption"><input type="radio" name="removeReason" value="ข้อมูลผู้รับผิดชอบไม่ถูกต้อง">ข้อมูลผู้รับผิดชอบไม่ถูกต้อง</label><label class="reasonOption"><input type="radio" name="removeReason" value="Other">อื่นๆ</label><input id="otherReason" class="reasonOther" placeholder="กรุณาระบุเหตุผล"><div class="modalBtns"><button class="btn cancelBtn" onclick="closeRemoveModal()">ยกเลิก</button><button id="confirmRemoveBtn" class="btn confirmRemove" onclick="confirmRemove()">ยืนยันนำออก</button></div></div></div><div class="app"><header class="head"><div class="top"><button class="back" id="back">‹</button><div><div class="title">Asset Detail</div><div class="sub" id="who">กำลังเชื่อมต่อ LINE...</div></div></div></header><main class="content"><div id="error" class="error"></div><div id="root" class="state"><div class="spin"></div>กำลังโหลดข้อมูล Asset...</div></main></div>
<script>
    
const LIFF_ID='2010143473-DPdFN5rP';
const SEARCH_FLOW_URL='https://defaultd9cd485e39bd4cc995398c97631fbb.71.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/06/workflows/25817dc28862410b92149ab4633a4401/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=sYSstQibB3PM-TBOtOK7dChdtEbaRdKh3DgXTRYlt6I';
const REMOVE_FLOW_URL='https://defaultd9cd485e39bd4cc995398c97631fbb.71.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/20/workflows/a0756da69e0645f6ba2620e7baac8ca6/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Vbs0qd-W0EhkFNz-P-uSKZm62NDEN8KfyUiUNLhFIyA';

const qs=new URLSearchParams(location.search); const assetNo=qs.get('assetNo')||'';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
$('back').onclick=()=>location.replace('./viewAsset.html?v=12');
function err(t){$('error').textContent=t;$('error').style.display='block';$('root').innerHTML=''}
async function init(){try{if(!assetNo)return err('ไม่พบ Asset No.');await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}const p=await liff.getProfile();$('who').textContent=p.displayName||'LINE connected';await load()}catch(e){err('เปิดหน้าไม่สำเร็จ: '+(e.message||e))}}
async function load(){try{const r=await fetch(SEARCH_FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'detail',assetNo})});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const a=d.item||(Array.isArray(d.items)?d.items[0]:null);if(!a)return err('ไม่พบ Asset '+assetNo);render(a)}catch(e){err('โหลด Asset ไม่สำเร็จ: '+(e.message||e))}}
function photo(url,label){return `<div><div class="photo" ${url?`onclick="openPhoto(this.querySelector('img').src,'${esc(label)}')"`:``}>${url?`<img src="${esc(url)}" alt="${esc(label)}" loading="lazy" onerror="this.parentElement.innerHTML='ไม่สามารถเปิดรูปได้'">`:'ยังไม่มีรูป'}</div><div class="photoLabel">${esc(label)}${url?' • แตะเพื่อขยาย':''}</div></div>`}
function render(a){const title=[a.manufacturer,a.model].filter(Boolean).join(' ')||a.assetType||'Asset';$('root').className='';$('root').innerHTML=`
<section class="card"><div class="heroRow"><div><div class="type">${esc(a.assetType||'Asset')}</div><div class="name">${esc(title)}</div><div class="assetNo">Asset No. ${esc(a.assetNo||assetNo)}</div></div><div class="pill">${esc(a.status||'Active')}</div></div></section>
<section class="card"><div class="sectionTitle">ข้อมูล Asset</div><div class="grid"><div class="item"><div class="label">Manufacturer</div><div class="value">${esc(a.manufacturer||'-')}</div></div><div class="item"><div class="label">Model</div><div class="value">${esc(a.model||'-')}</div></div><div class="item"><div class="label">Serial No.</div><div class="value">${esc(a.serialNo||'-')}</div></div><div class="item"><div class="label">Condition</div><div class="value">${esc(a.condition||'-')}</div></div></div></section>
<section class="card"><div class="sectionTitle">ผู้รับผิดชอบและพื้นที่</div><div class="grid"><div class="item"><div class="label">EmpCode</div><div class="value">${esc(a.empCode||'-')}</div></div><div class="item"><div class="label">EmpName</div><div class="value">${esc(a.empName||'-')}</div></div><div class="item"><div class="label">Plant</div><div class="value">${esc(a.plant||'-')}</div></div><div class="item"><div class="label">Department</div><div class="value">${esc(a.department||'-')}</div></div><div class="item"><div class="label">Area</div><div class="value">${esc(a.area||'-')}</div></div><div class="item"><div class="label">Cost Center</div><div class="value">${esc(a.costCenter||'-')}</div></div></div></section>
<section class="card"><div class="sectionTitle">รูปยืนยัน</div><div class="photos">${photo(a.assetPhotoUrl,'รูปภาพ Asset')}${photo(a.assetNoPhotoUrl,'รูปหมายเลข Asset No.')}</div></section>
<section class="card actions"><button class="btn edit" onclick="editAsset()">✏️ แก้ไขข้อมูล</button><button class="btn history" onclick="historyAsset()">🕘 ประวัติการเปลี่ยนแปลง</button><button class="btn remove" onclick="removeAsset()">นำออกจากความรับผิดชอบ</button></section>`}
function openPhoto(src,label){const box=$('lightbox');$('lightboxImg').src=src;$('lightboxLabel').textContent=label||'รูป Asset';box.classList.add('open');document.body.style.overflow='hidden'}
function closePhoto(e,force=false){if(force||e.target.id==='lightbox'){$('lightbox').classList.remove('open');$('lightboxImg').src='';document.body.style.overflow=''}}
function editAsset(){location.href=`./editAsset.html?assetNo=${encodeURIComponent(assetNo)}`}
function historyAsset(){location.href=`./assetHistory.html?assetNo=${encodeURIComponent(assetNo)}`}
function removeAsset(){$('removeAssetNo').textContent=assetNo;document.querySelectorAll('input[name="removeReason"]').forEach(x=>x.checked=false);$('otherReason').value='';$('otherReason').style.display='none';$('removeModal').classList.add('open');document.body.style.overflow='hidden'}
function closeRemoveModal(){$('removeModal').classList.remove('open');document.body.style.overflow=''}
function modalBackdrop(e){if(e.target.id==='removeModal')closeRemoveModal()}
document.querySelectorAll('input[name="removeReason"]').forEach(r=>r.addEventListener('change',()=>{$('otherReason').style.display=r.value==='Other'&&r.checked?'block':'none'}));
async function confirmRemove(){const selected=document.querySelector('input[name="removeReason"]:checked');if(!selected)return alert('กรุณาเลือกเหตุผล');const reason=selected.value==='Other'?$('otherReason').value.trim():selected.value;if(!reason)return alert('กรุณาระบุเหตุผล');if(!liff.isLoggedIn())return alert('ไม่พบข้อมูล LINE');const p=await liff.getProfile();const btn=$('confirmRemoveBtn');btn.disabled=true;btn.textContent='กำลังบันทึก...';try{const r=await fetch(REMOVE_FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assetNo,lineUserId:p.userId,reason})});let d={};try{d=await r.json()}catch{}if(!r.ok||d.ok===false)throw Error(d.message||('HTTP '+r.status));closeRemoveModal();alert('นำ Asset ออกจากความรับผิดชอบเรียบร้อย');location.replace('./viewAsset.html?v=14')}catch(e){alert('ดำเนินการไม่สำเร็จ: '+(e.message||e));btn.disabled=false;btn.textContent='ยืนยันนำออก'}}
init();
</script></body></html>
