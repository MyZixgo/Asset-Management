<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e">
<title>Asset History</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--b:#0f766e;--b2:#14b8a6;--bg:#f4f7f8;--card:#fff;--tx:#172126;--mu:#66757d;--ln:#e1e8eb;--red:#b91c1c;--orange:#b45309;--blue:#1d4ed8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;color:var(--tx)}.app{max-width:640px;margin:auto;min-height:100vh}.head{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 27px;border-radius:0 0 24px 24px}.top{display:flex;gap:12px;align-items:center}.back{border:0;background:#ffffff20;color:#fff;width:40px;height:40px;border-radius:12px;font-size:23px}.title{font-size:22px;font-weight:850}.sub{font-size:12px;opacity:.86}.content{padding:14px}.summary{background:#fff;border:1px solid var(--ln);border-radius:17px;padding:15px;margin-bottom:14px}.assetNo{font-size:18px;font-weight:850}.muted{color:var(--mu);font-size:12px;margin-top:3px}.timeline{position:relative;margin-left:8px;padding-left:23px}.timeline:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:#dbe4e7}.event{position:relative;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}.dot{position:absolute;left:-25px;top:17px;width:17px;height:17px;border-radius:50%;background:#fff;border:4px solid var(--b)}.event.edit .dot{border-color:var(--blue)}.event.remove .dot{border-color:#dc2626}.event.add .dot{border-color:#16a34a}.eventTop{display:flex;justify-content:space-between;gap:10px;align-items:start}.action{font-size:12px;font-weight:900;border-radius:999px;padding:5px 9px;background:#e6fffb;color:var(--b)}.edit .action{background:#eff6ff;color:var(--blue)}.remove .action{background:#fff1f2;color:#be123c}.add .action{background:#ecfdf5;color:#15803d}.date{font-size:11px;color:var(--mu);text-align:right}.reason{margin-top:10px;padding:9px 10px;background:#fff7ed;border-radius:10px;color:#9a3412;font-size:12px}.changes{margin-top:10px;display:grid;gap:7px}.change{background:#f8fafb;border-radius:10px;padding:9px}.field{font-size:11px;color:var(--mu);font-weight:700}.vals{font-size:12px;margin-top:3px;word-break:break-word}.old{color:#b91c1c}.new{color:#15803d}.arrow{color:#94a3b8;padding:0 4px}.actor{font-size:11px;color:var(--mu);margin-top:10px;border-top:1px solid #edf1f2;padding-top:8px}.state{text-align:center;color:var(--mu);padding:55px 15px}.spin{width:31px;height:31px;margin:0 auto 11px;border:3px solid #d9e3e7;border-top-color:var(--b);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.error{display:none;background:#fef2f2;color:var(--red);border:1px solid #fecaca;border-radius:13px;padding:12px;margin-bottom:12px}
</style></head><body>
<div class="app"><header class="head"><div class="top"><button id="back" class="back">‹</button><div><div class="title">ประวัติ Asset</div><div id="who" class="sub">กำลังเชื่อมต่อ LINE...</div></div></div></header><main class="content"><div id="error" class="error"></div><section class="summary"><div id="assetTitle" class="assetNo">-</div><div id="count" class="muted">กำลังโหลดประวัติ...</div></section><div id="root" class="state"><div class="spin"></div>กำลังโหลด...</div></main></div>
<script>
const LIFF_ID='2010143473-DPdFN5rP';
const HISTORY_FLOW_URL='https://defaultd9cd485e39bd4cc995398c97631fbb.71.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/12/workflows/b33ed9a047204be48ca10cbaf62c4733/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=PDi8hpRNIzCx8UUcIIye4Qu-wMXp8OyMhTf8mBl0z10';

const assetNo=new URLSearchParams(location.search).get('assetNo')||'';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
$('back').onclick=()=>location.replace(`./assetDetail.html?assetNo=${encodeURIComponent(assetNo)}&v=15`);
function error(t){$('error').textContent=t;$('error').style.display='block';$('root').innerHTML=''}
function obj(v){if(!v)return{};if(typeof v==='object')return v;try{return JSON.parse(v)}catch{return{}}}
function pretty(v){if(v===null||v===undefined||v==='')return '-';return String(v)}
function fmtDate(v){if(!v)return '-';const d=new Date(v);if(Number.isNaN(d.getTime()))return v;return new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Bangkok'}).format(d)}
function changes(oldD,newD){const o=obj(oldD),n=obj(newD);const keys=[...new Set([...Object.keys(o),...Object.keys(n)])];const labels={AssetType:'ประเภท',Manufacturer:'ผู้ผลิต',Model:'Model',SerialNo:'Serial No.',EmpCode:'EmpCode',EmpName:'ชื่อผู้รับผิดชอบ',Plant:'Plant',Department:'Department',Area:'Area',CostCenter:'Cost Center',LineUserId:'LINE User'};const changed=keys.filter(k=>String(o[k]??'')!==String(n[k]??''));if(!changed.length)return'';return `<div class="changes">${changed.map(k=>`<div class="change"><div class="field">${esc(labels[k]||k)}</div><div class="vals"><span class="old">${esc(pretty(o[k]))}</span><span class="arrow">→</span><span class="new">${esc(pretty(n[k]))}</span></div></div>`).join('')}</div>`}
function render(items){$('assetTitle').textContent='Asset No. '+assetNo;$('count').textContent=`${items.length} รายการเปลี่ยนแปลง`;if(!items.length){$('root').className='state';$('root').innerHTML='ยังไม่มีประวัติสำหรับ Asset นี้';return}$('root').className='timeline';$('root').innerHTML=items.map(x=>{const a=String(x.action||'').toUpperCase();const cls=a==='REMOVE'?'remove':a==='EDIT'?'edit':a==='ADD'?'add':'';return `<article class="event ${cls}"><span class="dot"></span><div class="eventTop"><span class="action">${esc(a||'ACTION')}</span><span class="date">${esc(fmtDate(x.actionDate))}</span></div>${x.reason?`<div class="reason">เหตุผล: ${esc(x.reason)}</div>`:''}${changes(x.oldData,x.newData)}<div class="actor">ดำเนินการโดย ${esc(x.empCode||x.lineUserId||'-')} • ${esc(x.source||'-')}</div></article>`}).join('')}
async function init(){try{if(!assetNo)return error('ไม่พบ Asset No.');await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}const p=await liff.getProfile();$('who').textContent=p.displayName||'LINE connected';const r=await fetch(HISTORY_FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assetNo,lineUserId:p.userId})});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.ok===false)throw Error(d.message||'ไม่สามารถโหลด History');const items=Array.isArray(d.items)?d.items:[];items.sort((a,b)=>new Date(b.actionDate||0)-new Date(a.actionDate||0));render(items)}catch(e){error('โหลดประวัติไม่สำเร็จ: '+(e.message||e))}}
init();
</script></body></html>
