<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e">
<title>Edit Asset</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--b:#0f766e;--b2:#14b8a6;--bg:#f4f7f8;--tx:#172126;--mu:#66757d;--ln:#e4eaed;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;color:var(--tx)}.app{max-width:640px;margin:auto;padding-bottom:30px}.head{background:linear-gradient(135deg,var(--b),var(--b2));color:white;padding:calc(16px + env(safe-area-inset-top)) 18px 24px;border-radius:0 0 24px 24px}.top{display:flex;gap:12px;align-items:center}.back{border:0;background:#ffffff20;color:white;width:40px;height:40px;border-radius:12px;font-size:23px}.title{font-size:22px;font-weight:800}.sub{font-size:12px;opacity:.86}.box{background:#fff;margin:14px 14px 0;padding:16px;border:1px solid var(--ln);border-radius:18px}.section{font-weight:850;margin-bottom:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.label{font-size:13px;font-weight:750;margin:8px 0 6px}.req{color:#dc2626}input,select{width:100%;border:1px solid #d4dde1;border-radius:12px;padding:13px;font-size:15px;background:white;outline:none}.readonly{background:#f4f7f8;color:#64748b}.empRow{display:grid;grid-template-columns:1fr 52px;gap:8px}.searchBtn{border:0;border-radius:12px;background:#e6fffb;color:var(--b);font-size:21px}.empCard{display:none;background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:12px;margin-top:8px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{position:relative;border:1.5px dashed #aebdc3;border-radius:15px;min-height:150px;overflow:hidden;background:#fafcfc;display:flex;align-items:center;justify-content:center;text-align:center}.photo img{width:100%;height:170px;object-fit:cover}.photo input{position:absolute;inset:0;opacity:0}.photoText{font-size:12px;color:var(--mu);padding:8px}.hint{font-size:11px;color:var(--mu);margin-top:6px}.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:15px;font-weight:850}.save{background:var(--b);color:white}.btn:disabled{opacity:.5}.msg{display:none;margin:14px;border-radius:13px;padding:12px;font-size:13px}.ok{display:block;background:#ecfdf5;color:#166534;border:1px solid #bbf7d0}.err{display:block;background:#fef2f2;color:var(--red);border:1px solid #fecaca}.loading{text-align:center;padding:50px;color:var(--mu)}.spin{width:30px;height:30px;border:3px solid #d9e3e7;border-top-color:var(--b);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 10px}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<div class="app"><header class="head"><div class="top"><button class="back" id="back">‹</button><div><div class="title">แก้ไข Asset</div><div class="sub" id="who">กำลังเชื่อมต่อ LINE...</div></div></div></header><div id="msg" class="msg"></div><div id="loading" class="loading"><div class="spin"></div>กำลังโหลดข้อมูล...</div>
<form id="form" hidden>
<section class="box"><div class="section">Asset</div><div class="label">Asset No.</div><input id="assetNo" class="readonly" readonly></section>
<section class="box"><div class="section">ข้อมูล Asset</div><div class="grid">
<div><div class="label">ประเภท <span class="req">*</span></div><select id="assetType"></select><input id="assetTypeOther" placeholder="ระบุประเภทอื่น" style="display:none;margin-top:7px"></div>
<div><div class="label">ผู้ผลิต</div><select id="manufacturer"></select><input id="manufacturerOther" placeholder="ระบุผู้ผลิตอื่น" style="display:none;margin-top:7px"></div>
<div><div class="label">Model</div><select id="model"></select><input id="modelOther" placeholder="ระบุ Model อื่น" style="display:none;margin-top:7px"></div>
<div><div class="label">Serial No.</div><input id="serialNo"></div>
<div class="full"><div class="label">Area</div><input id="area"></div>
</div></section>
<section class="box"><div class="section">ผู้รับผิดชอบ</div><div class="label">EmpCode <span class="req">*</span></div><div class="empRow"><input id="empCode" inputmode="numeric"><button id="empBtn" class="searchBtn" type="button">⌕</button></div><div id="empCard" class="empCard"></div></section>
<section class="box"><div class="section">รูปยืนยัน</div><div class="photos">
<label class="photo"><div id="assetText" class="photoText">📷<br>รูป Asset<br>แตะเพื่อเปลี่ยนรูป</div><img id="assetPreview" hidden><input id="assetPhoto" type="file" accept="image/*" capture="environment"></label>
<label class="photo"><div id="labelText" class="photoText">🏷️<br>รูป Asset No.<br>แตะเพื่อเปลี่ยนรูป</div><img id="labelPreview" hidden><input id="labelPhoto" type="file" accept="image/*" capture="environment"></label>
</div><div class="hint">ถ้าไม่เลือกรูปใหม่ ระบบจะเก็บรูปเดิมไว้</div></section>
<section class="box"><button id="saveBtn" class="btn save" type="submit">บันทึกการแก้ไข</button></section>
</form></div>
<script>
// ใช้ค่าเดียวกับ viewAsset / assetDetail
const LIFF_ID='2010143473-DPdFN5rP';
const SEARCH_FLOW_URL='https://defaultd9cd485e39bd4cc995398c97631fbb.71.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/06/workflows/25817dc28862410b92149ab4633a4401/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=sYSstQibB3PM-TBOtOK7dChdtEbaRdKh3DgXTRYlt6I';
const EMPLOYEE_FLOW_URL='https://defaultd9cd485e39bd4cc995398c97631fbb.71.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/25/workflows/0676c947f5b34ab8b1be1ca453594242/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=qBEviZgPIhgxMS7qpyMgplFcf7VM735vLWjyc_I8Jvs';
const UPDATE_FLOW_URL='https://defaultd9cd485e39bd4cc995398c97631fbb.71.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/24/workflows/b6956f0d69ae41ffa7cc624a5a2e7c6e/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=pChucJbNTD2wg5moNxscwvGNHSsdLzKJRxcI53o4w4U';

const assetNo=new URLSearchParams(location.search).get('assetNo')||'';
const $=id=>document.getElementById(id); let profile=null,original=null,employeeData=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const TYPES=['All in One PC','Desktop / Workstation','Digital Camera','Fitness Equipment','Monitor','Notebook','Printer','Refrigerator','Tablet','TV','Video Camera'];
const MAKERS=['Apple','Asus','Canon','Dell','Hitachi','HP','IBM','Lenovo','Mitsubishi','Panasonic','Ricoh','Sony','Thaiseri','Toyota'];
function options(el,values,current,label){const vals=[...new Set(values.filter(Boolean))];if(current&&!vals.includes(current))vals.push(current);el.innerHTML=`<option value="">เลือก${label}</option>`+vals.sort().map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')+'<option value="Other">Other / ระบุเอง</option>';if(current)el.value=current}
function other(sel,input){$(input).style.display=$(sel).value==='Other'?'block':'none'}
$('assetType').onchange=()=>other('assetType','assetTypeOther');$('manufacturer').onchange=()=>other('manufacturer','manufacturerOther');$('model').onchange=()=>other('model','modelOther');
function valueOf(sel,otherId){return $(sel).value==='Other'?$(otherId).value.trim():$(sel).value}
function msg(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err');$('msg').style.display='block';scrollTo({top:0,behavior:'smooth'})}
$('back').onclick=()=>location.replace(`./assetDetail.html?assetNo=${encodeURIComponent(assetNo)}&v=13`);
async function init(){try{if(!assetNo)throw Error('ไม่พบ Asset No.');await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}profile=await liff.getProfile();$('who').textContent=profile.displayName||'LINE connected';await loadAsset()}catch(e){$('loading').hidden=true;msg(e.message||e)}}
async function loadAsset(){const r=await fetch(SEARCH_FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'detail',assetNo})});if(!r.ok)throw Error('โหลด Asset ไม่สำเร็จ HTTP '+r.status);const d=await r.json();original=d.item||(d.items||[])[0];if(!original)throw Error('ไม่พบ Asset');$('assetNo').value=original.assetNo||assetNo;options($('assetType'),TYPES,original.assetType,'ประเภท');options($('manufacturer'),MAKERS,original.manufacturer,'ผู้ผลิต');options($('model'),[original.model],original.model,'Model');$('serialNo').value=original.serialNo||'';$('area').value=original.area||'';$('empCode').value=original.empCode||'';employeeData={pr_code:original.empCode||'',pr_name:original.empName||'',plant:original.plant||'',department:original.department||'',cost_center:original.costCenter||''};showEmployee();setPhoto('assetPreview','assetText',original.assetPhotoUrl);setPhoto('labelPreview','labelText',original.assetNoPhotoUrl);$('loading').hidden=true;$('form').hidden=false}
function setPhoto(imgId,textId,url){if(!url)return;$(imgId).src=url;$(imgId).hidden=false;$(textId).style.display='none'}
function showEmployee(){if(!employeeData)return;$('empCard').style.display='block';$('empCard').innerHTML=`<b>${esc(employeeData.pr_name||'-')}</b><br><span style="font-size:12px;color:#66757d">${esc(employeeData.pr_code)}<br>${esc(employeeData.plant)} / ${esc(employeeData.department)}<br>Cost Center: ${esc(employeeData.cost_center||'-')}</span>`}
$('empCode').oninput=()=>{employeeData=null;$('empCard').style.display='none'};
$('empBtn').onclick=async()=>{const code=$('empCode').value.trim();if(!code)return msg('กรุณากรอก EmpCode');try{const r=await fetch(EMPLOYEE_FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pr_code:code})});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),e=d.employee||(d.items||[])[0];if(!e)throw Error('ไม่พบ EmpCode');employeeData={pr_code:String(e.pr_code||code),pr_name:e.pr_name||'',plant:e.plant||'',department:e.department||'',cost_center:e.cost_center||''};showEmployee();msg('พบข้อมูลพนักงานแล้ว',true)}catch(e){msg('ค้นหาพนักงานไม่สำเร็จ: '+(e.message||e))}};
function preview(input,img,text){$(input).onchange=()=>{const f=$(input).files[0];if(!f)return;$(img).src=URL.createObjectURL(f);$(img).hidden=false;$(text).style.display='none'}}preview('assetPhoto','assetPreview','assetText');preview('labelPhoto','labelPreview','labelText');
async function imageData(file,max=1280,q=.72){if(!file)return null;const b=await createImageBitmap(file);let w=b.width,h=b.height;if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(b,0,0,w,h);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob)})}
$('form').onsubmit=async e=>{e.preventDefault();if(!employeeData||employeeData.pr_code!==$('empCode').value.trim())return msg('กรุณาค้นหา EmpCode เพื่อยืนยันข้อมูลพนักงาน');const assetType=valueOf('assetType','assetTypeOther');if(!assetType)return msg('กรุณาระบุประเภท Asset');const btn=$('saveBtn');btn.disabled=true;btn.textContent='กำลังบันทึก...';try{const [assetPhotoBase64,assetNoPhotoBase64]=await Promise.all([imageData($('assetPhoto').files[0]),imageData($('labelPhoto').files[0])]);const payload={assetNo,assetType,manufacturer:valueOf('manufacturer','manufacturerOther'),model:valueOf('model','modelOther'),serialNo:$('serialNo').value.trim(),area:$('area').value.trim(),empCode:employeeData.pr_code,empName:employeeData.pr_name,plant:employeeData.plant,department:employeeData.department,costCenter:employeeData.cost_center,lineUserId:profile.userId,assetPhotoBase64,assetNoPhotoBase64,source:'LINE'};const r=await fetch(UPDATE_FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.ok===false)throw Error(d.message||'Update failed');msg('แก้ไข Asset เรียบร้อย',true);setTimeout(()=>location.replace(`./assetDetail.html?assetNo=${encodeURIComponent(assetNo)}&v=13`),700)}catch(e){msg('บันทึกไม่สำเร็จ: '+(e.message||e))}finally{btn.disabled=false;btn.textContent='บันทึกการแก้ไข'}};
init();
</script></body></html>
