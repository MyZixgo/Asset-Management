<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>My Asset</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root{--bg:#f4f7f8;--card:#fff;--text:#172126;--muted:#66757d;--line:#e5eaed;--brand:#0f766e;--brand2:#14b8a6;--ok:#15803d;--danger:#b91c1c;--shadow:0 8px 24px rgba(17,24,39,.07)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;color:var(--text)}
    .app{max-width:640px;margin:auto;min-height:100vh;padding-bottom:110px}.hero{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 28px;border-radius:0 0 28px 28px}
    .hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:26px;font-weight:800}.sub{opacity:.86;font-size:13px;margin-top:3px}.count{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700}
    .content{padding:16px}.toolbar{display:flex;gap:10px;margin-top:-30px}.search{flex:1;background:#fff;border:none;border-radius:16px;padding:15px 16px;box-shadow:var(--shadow);outline:none;font-size:15px}.refresh{width:50px;border:none;border-radius:16px;background:#fff;box-shadow:var(--shadow);font-size:20px;color:var(--brand)}
    .list{display:grid;gap:12px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 3px 12px rgba(17,24,39,.035);cursor:pointer}.row{display:flex;justify-content:space-between;gap:14px}.type{font-size:12px;color:var(--brand);font-weight:800;text-transform:uppercase;letter-spacing:.4px}.name{font-size:18px;font-weight:800;margin-top:3px}.assetno{color:var(--muted);font-size:13px;margin-top:5px}.status{height:max-content;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#dcfce7;color:#166534}.status.inactive{background:#f1f5f9;color:#475569}.meta{display:flex;gap:7px;align-items:flex-start;border-top:1px solid var(--line);margin-top:13px;padding-top:12px;color:var(--muted);font-size:13px}.arrow{font-size:22px;color:#94a3b8;align-self:center}
    .state{padding:48px 15px;text-align:center;color:var(--muted)}.spinner{width:32px;height:32px;border:3px solid #d9e3e7;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
    .error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;border-radius:14px;padding:13px;margin-top:16px;font-size:13px;display:none}
    .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:min(calc(100% - 32px),608px);border:0;border-radius:16px;background:var(--brand);color:#fff;font-weight:800;font-size:16px;padding:16px;box-shadow:0 12px 28px rgba(15,118,110,.28)}
    .emptyIcon{font-size:42px;margin-bottom:7px}.small{font-size:12px;color:#94a3b8;margin-top:6px}
  </style>
</head>
<body>
<div class="app">
  <header class="hero"><div class="hero-top"><div><div class="title">My Asset</div><div class="sub" id="userText">กำลังตรวจสอบ LINE...</div></div><div class="count" id="count">0 รายการ</div></div></header>
  <main class="content">
    <div class="toolbar"><input class="search" id="search" placeholder="ค้นหา Asset No., Type, Model..." autocomplete="off"><button class="refresh" id="refresh" aria-label="Refresh">↻</button></div>
    <div class="error" id="error"></div>
    <div class="list" id="list"><div class="state"><div class="spinner"></div>กำลังโหลด Asset...</div></div>
  </main>
</div>
<button class="fab" id="addBtn">＋ เพิ่ม Asset</button>
<script>
  // ===== CONFIG: แก้ 2 ค่านี้ก่อนนำขึ้น GitHub =====
  const LIFF_ID = "2010143473-DPdFN5rP";
  const SEARCH_FLOW_URL = "https://defaultd9cd485e39bd4cc995398c97631fbb.71.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/06/workflows/25817dc28862410b92149ab4633a4401/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=sYSstQibB3PM-TBOtOK7dChdtEbaRdKh3DgXTRYlt6I";

  let allAssets = [];
  let profile = null;
  const el = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

  async function init(){
    try{
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
      profile = await liff.getProfile();
      el('userText').textContent = profile.displayName ? `ผู้ใช้งาน: ${profile.displayName}` : 'เชื่อมต่อ LINE แล้ว';
      await loadAssets(profile.userId);
    }catch(err){ showError('ไม่สามารถเริ่มระบบได้: ' + (err.message || err)); }
  }

  async function loadAssets(lineUserId){
    setLoading(); hideError();
    try{
      const res = await fetch(SEARCH_FLOW_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ mode:'my', lineUserId })
      });
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if(!data.ok) throw new Error(data.message || 'Flow returned ok=false');
      allAssets = Array.isArray(data.items) ? data.items : [];
      render(allAssets);
    }catch(err){
      el('list').innerHTML = '';
      el('count').textContent = '0 รายการ';
      showError('โหลด Asset ไม่สำเร็จ: ' + (err.message || err));
    }
  }

  function render(items){
    el('count').textContent = `${items.length} รายการ`;
    if(!items.length){
      el('list').innerHTML = '<div class="state"><div class="emptyIcon">📦</div><b>ยังไม่มี Asset ในความรับผิดชอบ</b><div class="small">กด “เพิ่ม Asset” เพื่อเริ่มต้น</div></div>';
      return;
    }
    el('list').innerHTML = items.map(a => {
      const title = [a.manufacturer,a.model].filter(Boolean).join(' ') || a.assetType || 'Asset';
      const location = [a.plant,a.department,a.area].filter(Boolean).join(' / ') || '-';
      const activeClass = String(a.status || '').toLowerCase() === 'active' ? '' : ' inactive';
      return `<article class="card" data-asset="${esc(a.assetNo)}">
        <div class="row"><div><div class="type">${esc(a.assetType || 'Asset')}</div><div class="name">${esc(title)}</div><div class="assetno">Asset No. ${esc(a.assetNo || '-')}</div></div><div class="status${activeClass}">${esc(a.status || '-')}</div></div>
        <div class="row"><div class="meta"><span>📍</span><span>${esc(location)}</span>${a.condition ? `<span> • ${esc(a.condition)}</span>`:''}</div><div class="arrow">›</div></div>
      </article>`;
    }).join('');
    document.querySelectorAll('.card').forEach(card => card.addEventListener('click', () => openDetail(card.dataset.asset)));
  }

  function openDetail(assetNo){
    // พร้อมเชื่อม assetDetail.html ในขั้นถัดไป
    location.href = `assetDetail.html?assetNo=${encodeURIComponent(assetNo)}`;
  }

  function filter(){
    const q = el('search').value.trim().toLowerCase();
    if(!q){ render(allAssets); return; }
    render(allAssets.filter(a => [a.assetNo,a.assetType,a.manufacturer,a.model,a.plant,a.department,a.area,a.status,a.condition].some(v => String(v ?? '').toLowerCase().includes(q))));
  }

  function setLoading(){ el('list').innerHTML='<div class="state"><div class="spinner"></div>กำลังโหลด Asset...</div>'; }
  function showError(msg){ el('error').textContent=msg; el('error').style.display='block'; }
  function hideError(){ el('error').style.display='none'; }

  el('search').addEventListener('input', filter);
  el('refresh').addEventListener('click', () => profile && loadAssets(profile.userId));
  el('addBtn').addEventListener('click', () => location.href='addAsset.html');
  init();
</script>
</body>
</html>
